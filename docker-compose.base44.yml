# Base44 development compose — runs the app from cloned source with live reload.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: cheblychas
      POSTGRES_PASSWORD: cheblychas_dev
      POSTGRES_DB: cheblychas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheblychas"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # One-shot: install deps, push DB schema, seed data
  setup:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - pnpm-store:/root/.local/share/pnpm
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "npm install -g pnpm@9 &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @workspace/db run push &&
      pnpm --filter @workspace/scripts run seed"

  # API server — Express 5 (esbuild bundle + start, no watch)
  api:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - pnpm-store:/root/.local/share/pnpm
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=8080
      - NODE_ENV=development
      - WEBSITE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    command: >-
      sh -c "npm install -g pnpm@9 &&
      pnpm --filter @workspace/api-server run dev"

  # Frontend — Vite dev server with HMR (port 3000)
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - pnpm-store:/root/.local/share/pnpm
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=3000
      - BASE_PATH=/
      - API_PROXY_TARGET=http://api:8080
    depends_on:
      setup:
        condition: service_completed_successfully
    command: >-
      sh -c "npm install -g pnpm@9 &&
      pnpm --filter @workspace/watch-configurator run dev"

volumes:
  pgdata:
  pnpm-store:
